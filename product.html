<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PB32 SHOES | Collection</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f6f6f6;
    color: #111;
}

header {
    background: #080808;
    color: white;
    padding: 20px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.logo {
    font-size: 27px;
    font-weight: 900;
}

.logo span, footer span {
    color: #e5a900;
}

nav {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
}

nav a {
    color: white;
    text-decoration: none;
    font-size: 13px;
    font-weight: bold;
}

nav a:hover {
    color: #e5a900;
}

.hero {
    background: linear-gradient(90deg, #080808, #333);
    color: white;
    text-align: center;
    padding: 65px 15px;
}

.hero h1 {
    font-size: 42px;
    letter-spacing: 2px;
}

.hero h1 span {
    color: #e5a900;
}

.hero p {
    color: #ccc;
    margin-top: 15px;
}

.filters {
    text-align: center;
    padding: 35px 15px 15px;
}

.search {
    width: 90%;
    max-width: 450px;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 5px;
    margin-bottom: 22px;
    font-size: 15px;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

.buttons button {
    padding: 12px 22px;
    background: #111;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
}

.buttons button:hover,
.buttons button.active {
    background: #e5a900;
    color: black;
}

.result-count {
    text-align: center;
    color: #666;
    margin: 15px 0;
    font-size: 14px;
}

.products {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 22px;
    padding: 20px 7% 65px;
}

.card {
    background: white;
    border-radius: 9px;
    padding: 15px;
    text-align: center;
    box-shadow: 0 3px 12px #0001;
    transition: .3s;
}

.card:hover {
    transform: translateY(-6px);
    box-shadow: 0 8px 20px #0002;
}

.image-box {
    height: 190px;
    background: #f4f4f4;
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
}

.product-image {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

.image-fallback {
    display: none;
    font-size: 75px;
    justify-content: center;
    align-items: center;
    height: 190px;
}

.category-label {
    display: inline-block;
    margin-top: 13px;
    padding: 5px 12px;
    background: #fff3cc;
    color: #8b6500;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
}

.card h3 {
    font-size: 15px;
    margin: 12px 0;
    min-height: 36px;
}

.price {
    color: #b47f00;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 15px;
}

.card a {
    display: block;
    padding: 12px;
    background: #111;
    color: white;
    text-decoration: none;
    border-radius: 5px;
    font-weight: bold;
    font-size: 13px;
}

.card a:hover {
    background: #e5a900;
    color: black;
}

.empty {
    display: none;
    text-align: center;
    padding: 35px;
    color: #777;
    font-size: 18px;
}

footer {
    background: #080808;
    color: white;
    text-align: center;
    padding: 35px 15px;
    line-height: 2;
}

@media(max-width: 900px) {
    .products {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 550px) {
    header {
        flex-direction: column;
        text-align: center;
    }

    nav {
        justify-content: center;
        gap: 12px;
    }

    nav a {
        font-size: 11px;
    }

    .products {
        grid-template-columns: 1fr;
        padding-left: 8%;
        padding-right: 8%;
    }

    .hero h1 {
        font-size: 29px;
    }
}
</style>
</head>

}

];

let currentFilter = "all";

function renderProducts() {

    const list = document.getElementById("productList");
    const search = document.getElementById("search").value.toLowerCase().trim();

    list.innerHTML = "";

    const filtered = products.filter(product => {

        const categoryMatch =
            currentFilter === "all" ||
            product.category === currentFilter ||
            product.type === currentFilter;

        const searchMatch =
            product.name.toLowerCase().includes(search);

        return categoryMatch && searchMatch;
    });

    document.getElementById("empty").style.display =
        filtered.length === 0 ? "block" : "none";

    document.getElementById("resultCount").textContent =
        filtered.length + " products found";

    filtered.forEach(product => {

        const card = document.createElement("div");
        card.className = "card";

        const label = product.category === "premium"
            ? "Premium"
            : product.type === "sports"
            ? "Sports Shoes"
            : product.category;

        card.innerHTML = `
           <div class="image-box">
    <img
        class="product-image"
        src="${product.image}"
        alt="${product.name}"
        onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
    >
    <div class="image-fallback">👟</div>
</div>
            <div class="category-label">${label}</div>
            <h3>${product.name}</h3>
            <div class="price">
                ₹${product.price.toLocaleString("en-IN")}
            </div>
            <a href="shopnow.html">
   SHOP NOW
</a>
        `;

        list.appendChild(card);
    });
}

function filterProducts(category, button) {

    currentFilter = category;

    document.querySelectorAll(".buttons button")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    renderProducts();
}

document.getElementById("search")
    .addEventListener("input", renderProducts);

renderProducts();
