```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Place Your Order | PB32 SHOES</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f4f4;
    color: #222;
}

header {
    background: #111;
    color: white;
    text-align: center;
    padding: 22px;
}

header h1 {
    font-size: 28px;
    letter-spacing: 2px;
}

.container {
    max-width: 650px;
    margin: 35px auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 15px #00000015;
}

h2 {
    text-align: center;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
}

label {
    display: block;
    margin: 15px 0 7px;
    font-weight: bold;
}

input, select, textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
}

textarea {
    resize: vertical;
    min-height: 85px;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 15px;
    background: #111;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #333;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #111;
}

@media(max-width: 600px) {
    .container {
        margin: 20px 12px;
        padding: 22px;
    }
}
</style>
</head>

<body>

<header>
    <h1>PB32 SHOES</h1>
</header>

<div class="container">

    <h2>PLACE YOUR ORDER</h2>
    <p class="subtitle">Fill in your details to request your order.</p>

    <form id="orderForm">

        <label>Full Name</label>
        <input type="text" name="name" placeholder="Enter your name" required>

        <label>Mobile Number</label>
        <input type="tel" name="phone" placeholder="Enter mobile number"
        pattern="[0-9]{10}" maxlength="10" required>

        <label>Email Address</label>
        <input type="email" name="email" placeholder="Enter your email" required>

        <label>Product Name</label>
        <input type="text" name="product" id="productName"
        placeholder="Enter shoe name" required>

        <label>Shoe Size</label>
        <select name="size" required>
            <option value="">Select Shoe Size</option>
            <option>UK 6</option>
            <option>UK 7</option>
            <option>UK 8</option>
            <option>UK 9</option>
            <option>UK 10</option>
            <option>UK 11</option>
        </select>

        <label>Quantity</label>
        <input type="number" name="quantity" min="1" value="1" required>

        <label>Delivery Address</label>
        <textarea name="address" placeholder="House number, street, city, state, PIN code" required></textarea>

        <label>Payment Preference</label>
        <select name="payment" required>
            <option value="">Select Payment Preference</option>
            <option>Cash on Delivery (COD)</option>
            <option>Online Payment</option>
        </select>

        <label>Additional Instructions</label>
        <textarea name="instructions" placeholder="Any special instructions?"></textarea>

        <button type="submit">PLACE ORDER</button>

    </form>

    <a class="back" href="product.html">← Back to Products</a>

</div>

<script>
document.getElementById("orderForm").addEventListener("submit", function(event) {
    event.preventDefault();
    alert("Your order form is ready! Please connect an order service to submit it.");
});
</script>

</body>
</html>
