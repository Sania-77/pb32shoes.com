
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | PB32 SHOES</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: #080808;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    color: white;
}

.login-container {
    width: 100%;
    max-width: 430px;
    background: #151515;
    padding: 40px 35px;
    border: 1px solid #b89646;
    border-radius: 15px;
    box-shadow: 0 0 30px rgba(184,150,70,0.15);
}

.logo {
    text-align: center;
    color: #d4af62;
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #aaa;
    font-size: 13px;
    margin-bottom: 30px;
}

h2 {
    text-align: center;
    margin-bottom: 28px;
}

.input-group {
    margin-bottom: 20px;
}

label {
    display: block;
    color: #d4af62;
    margin-bottom: 8px;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 14px;
    background: #090909;
    color: white;
    border: 1px solid #444;
    border-radius: 7px;
    outline: none;
    font-size: 15px;
}

input:focus {
    border-color: #d4af62;
}

.login-btn {
    width: 100%;
    padding: 14px;
    background: #d4af62;
    color: #080808;
    border: none;
    border-radius: 7px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

.login-btn:hover {
    background: #f0cf82;
}

#message {
    text-align: center;
    margin-top: 18px;
    font-size: 14px;
    line-height: 1.5;
}

.signup-link {
    text-align: center;
    margin-top: 25px;
    color: #aaa;
    font-size: 14px;
}

.signup-link a,
.back-home {
    color: #d4af62;
    text-decoration: none;
    font-weight: bold;
}

.back-home {
    display: block;
    text-align: center;
    margin-top: 22px;
    font-size: 14px;
}

@media(max-width: 480px) {
    .login-container {
        padding: 30px 22px;
    }
}
</style>
</head>

<body>

<div class="login-container">

    <div class="logo">PB32 SHOES</div>
    <p class="subtitle">STEP INTO YOUR STYLE</p>

    <h2>Welcome Back!</h2>

    <form id="loginForm">

        <div class="input-group">
            <label>Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >
        </div>

        <div class="input-group">
            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
            LOGIN
        </button>

        <p id="message"></p>

    </form>

    <div class="signup-link">
        Don't have an account?
        <a href="signup.html">Sign Up</a>
    </div>

    <a href="index.html" class="back-home">
        ← Back to Home
    </a>

</div>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword
} from
"https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyA9LFfkR_flA6Y2W3oKEtJSSKytgqty1zQ",
    authDomain: "pb32-shoes.firebaseapp.com",
    projectId: "pb32-shoes",
    storageBucket: "pb32-shoes.firebasestorage.app",
    messagingSenderId: "535811826741",
    appId: "1:535811826741:web:71b0aff54f39350ce43d7c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const button = document.getElementById("loginBtn");

form.addEventListener("submit", async function(e) {

    e.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    button.disabled = true;
    button.textContent = "PLEASE WAIT...";
    message.textContent = "";

    try {

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        message.style.color = "#8ee6a1";
message.textContent = "Login successful! Welcome to PB32 SHOES.";

setTimeout(() => {
    window.location.href = "dashboard.html";
}, 1000);

    } catch(error) {

        message.style.color = "#ff7777";

        if (
            error.code === "auth/invalid-credential" ||
            error.code === "auth/wrong-password" ||
            error.code === "auth/user-not-found"
        ) {
            message.textContent =
                "Incorrect email or password.";
        } else if (error.code === "auth/invalid-email") {
            message.textContent =
                "Please enter a valid email address.";
        } else {
            message.textContent =
                "Login failed. Please try again.";
        }

    } finally {

        button.disabled = false;
        button.textContent = "LOGIN";

    }

});

</script>

</body>
</html>
