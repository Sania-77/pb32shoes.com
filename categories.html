<section class="categories" id="categories">
  <h2>Our Products</h2>
  <p>Explore Our Latest Collection</p>

  <div class="product-grid" id="productGrid"></div>
</section>

<style>
.categories {
  padding: 50px 5%;
  text-align: center;
  background: #fff;
}

.categories h2 {
  font-size: 32px;
  color: #222;
}

.categories p {
  color: #777;
  margin-bottom: 30px;
}

.product-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
}

.product-card {
  border: 1px solid #eee;
  border-radius: 12px;
  padding: 12px;
  background: white;
  text-align: left;
}

.product-card img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  border-radius: 9px;
}

.product-card h3 {
  font-size: 17px;
  margin: 12px 0 6px;
}

.price {
  color: #e65100;
  font-weight: bold;
  font-size: 19px;
}

.product-card a {
  display: block;
  text-align: center;
  background: #222;
  color: white;
  padding: 10px;
  margin-top: 12px;
  border-radius: 7px;
  text-decoration: none;
}

@media(max-width: 768px) {
  .product-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media(max-width: 480px) {
  .product-grid {
    grid-template-columns: 1fr;
  }
}
</style>
