
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PB32 SHOES | Categories</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f5f5f5;
    color: #111;
}

header {
    background: #080808;
    color: white;
    padding: 22px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 27px;
    font-weight: 900;
}

.logo span {
    color: #e5a900;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 22px;
    font-weight: bold;
}

nav a:hover {
    color: #e5a900;
}

.heading {
    text-align: center;
    padding: 45px 15px 25px;
}

.heading h1 {
    font-size: 36px;
}

.heading span {
    color: #d69b00;
}

.heading p {
    color: #777;
    margin-top: 12px;
}

.search {
    display: block;
    width: 85%;
    max-width: 450px;
    margin: 20px auto;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin: 25px 10px 35px;
}

.buttons button {
    background: #111;
    color: white;
    border: none;
    padding: 13px 25px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
}

.buttons button.active,
.buttons button:hover {
    background: #e5a900;
    color: black;
}

.product-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 22px;
    padding: 10px 7% 60px;
}

.card {
    background: white;
    border-radius: 10px;
    padding: 15px;
    text-align: center;
    box-shadow: 0 3px 12px #0001;
    transition: .3s;
}

.card:hover {
    transform: translateY(-6px);
    box-shadow: 0 8px 20px #0002;
}

.product-image {
    width: 100%;
    height: 210px;
    object-fit: contain;
    background: #fafafa;
    border-radius: 7px;
}

.card h3 {
    font-size: 15px;
    margin: 15px 0 10px;
}

.price {
    color: #b47f00;
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 15px;
}

.card a {
    display: block;
    background: #111;
    color: white;
    text-decoration: none;
    padding: 12px;
    border-radius: 5px;
    font-weight: bold;
}

.card a:hover {
    background: #e5a900;
    color: black;
}

.empty {
    text-align: center;
    padding: 30px;
    display: none;
}

footer {
    background: #080808;
    color: white;
    text-align: center;
    padding: 30px;
}

footer span {
    color: #e5a900;
}

@media(max-width: 850px) {
    .product-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 550px) {
    header {
        flex-direction: column;
        gap: 18px;
    }

    nav a {
        margin: 0 6px;
        font-size: 12px;
    }

    .product-grid {
        grid-template-columns: 1fr;
    }

    .heading h1 {
        font-size: 27px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">PB32 <span>SHOES.</span></div>

    <nav>
        <a href="index.html">HOME</a>
        <a href="categories.html">CATEGORIES</a>
        <a href="contact.html">CONTACT</a>
    </nav>
</header>

<div class="heading">
    <h1>SHOP BY <span>CATEGORY</span></h1>
    <p>Find Your Perfect Style With PB32 Shoes</p>
</div>

<input
    type="text"
    class="search"
    id="search"
    placeholder="Search your favourite shoes..."
>

<div class="buttons">
    <button class="active" onclick="showCategory('all',this)">ALL SHOES</button>
    <button onclick="showCategory('men',this)">MEN</button>
    <button onclick="showCategory('women',this)">WOMEN</button>
</div>

<div class="product-grid" id="productGrid"></div>

<div class="empty" id="empty">
    No products found.
</div>

<footer>
    <h2>PB32 <span>SHOES.</span></h2>
    <p>Step Into Style. Walk With Confidence.</p>
    <p>© 2026 PB32 SHOES</p>
</footer>

<script>

link: "https://www.superkicks.in/products/nike-dunk-low-retro-white-black-white",
image: ""
}

];

let currentCategory = "all";

function displayProducts() {

    const grid = document.getElementById("productGrid");
    const search = document.getElementById("search").value.toLowerCase();

    grid.innerHTML = "";

    const filtered = products.filter(product => {

        const matchCategory =
            currentCategory === "all" ||
            product.category === currentCategory;

        const matchSearch =
            product.name.toLowerCase().includes(search);

        return matchCategory && matchSearch;
    });

    document.getElementById("empty").style.display =
        filtered.length ? "none" : "block";

    filtered.forEach(product => {

        const card = document.createElement("div");
        card.className = "card";

        const image = product.image
            ? `<img class="product-image"
                src="${product.image}"
                alt="${product.name}"
                onerror="this.style.display='none'">`
            : `<div class="product-image"
                style="display:flex;align-items:center;justify-content:center;font-size:65px">👟</div>`;

        const price = product.price > 0
            ? "₹" + product.price.toLocaleString("en-IN")
            : "Check Latest Price";

        card.innerHTML = `
            ${image}
            <h3>${product.name}</h3>
            <div class="price">${price}</div>
            <a href="${product.link}"
               target="_blank"
               rel="noopener noreferrer">
               VIEW PRODUCT
            </a>
        `;

        grid.appendChild(card);
    });
}

function showCategory(category, button) {

    currentCategory = category;

    document.querySelectorAll(".buttons button")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    displayProducts();
}

document.getElementById("search")
    .addEventListener("input", displayProducts);

displayProducts();

</script>

</body>
</html>
