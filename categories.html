<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PB32 Shoes | Categories</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

header {
    background: #111;
    color: white;
    text-align: center;
    padding: 25px 10px;
}

header h1 {
    margin: 0;
    letter-spacing: 2px;
}

header p {
    color: #ddd;
}

nav {
    background: #222;
    padding: 15px;
    text-align: center;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 12px;
}

h2 {
    text-align: center;
    margin-top: 30px;
}

.buttons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    padding: 15px;
}

.buttons button {
    padding: 12px 22px;
    border: none;
    background: #222;
    color: white;
    border-radius: 7px;
    cursor: pointer;
    font-size: 15px;
}

.buttons button:hover,
.buttons button.active {
    background: #b58b42;
}

.products {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    padding: 25px;
    max-width: 1200px;
    margin: auto;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 3px 12px #ddd;
}

.shoe-icon {
    font-size: 65px;
    background: #f1f1f1;
    padding: 25px;
    border-radius: 10px;
}

.card h3 {
    margin-bottom: 8px;
}

.price {
    font-size: 21px;
    font-weight: bold;
    color: #a87928;
}

.card a {
    display: inline-block;
    margin-top: 10px;
    background: #222;
    color: white;
    text-decoration: none;
    padding: 11px 20px;
    border-radius: 6px;
}

.card a:hover {
    background: #b58b42;
}

footer {
    background: #111;
    color: white;
    text-align: center;
    padding: 20px;
    margin-top: 30px;
}
</style>
</head>

<body>

<header>
    <h1>PB32 SHOES</h1>
    <p>Find Your Perfect Shoes</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="categories.html">Categories</a>
</nav>

<h2>Explore Our Categories</h2>

<div class="buttons">
    <button class="active"
    onclick="showCategory('men', this)">
    Men Shoes
    </button>

    <button onclick="showCategory('women', this)">
    Women Shoes
    </button>

    <button onclick="showCategory('premium', this)">
    Premium Collection
    </button>
</div>

<div class="products" id="product-list"></div>

<footer>
    <h3>PB32 SHOES</h3>
    <p>Step Into Style. Walk With Confidence.</p>
    <p>© 2026 PB32 Shoes</p>
</footer>

];

function showCategory(category, button) {

    const list = document.getElementById("product-list");

    list.innerHTML = "";

    document.querySelectorAll(".buttons button")
    .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    const filtered = products.filter(
        product => product.category === category
    );

    filtered.forEach(product => {

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <div class="shoe-icon">👟</div>
            <h3>${product.name}</h3>
            <p class="price">
                ₹${product.price.toLocaleString("en-IN")}
            </p>
            <a href="${product.link}"
               target="_blank"
               rel="noopener noreferrer">
               View Product
            </a>
        `;

        list.appendChild(card);

    });
}

const params = new URLSearchParams(window.location.search);

const selectedCategory = params.get("category") || "men";

const selectedButton = [...document.querySelectorAll(".buttons button")]
    .find(btn => btn.getAttribute("onclick").includes("'" + selectedCategory + "'"));

if (selectedButton) {
    showCategory(selectedCategory, selectedButton);
} else {
    showCategory("men", document.querySelector(".buttons button"));
}

</script>
