
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | PB32 SHOES</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: #080808;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
    color: white;
}

.signup-container {
    width: 100%;
    max-width: 450px;
    background: #151515;
    padding: 40px 35px;
    border: 1px solid #b89646;
    border-radius: 15px;
    box-shadow: 0 0 30px rgba(184,150,70,0.15);
}

.logo {
    text-align: center;
    color: #d4af62;
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #aaa;
    margin-bottom: 30px;
    font-size: 14px;
}

h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #fff;
}

.input-group {
    margin-bottom: 18px;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #d4af62;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #444;
    background: #090909;
    color: white;
    border-radius: 7px;
    outline: none;
    font-size: 15px;
}

input:focus {
    border-color: #d4af62;
}

.signup-btn {
    width: 100%;
    padding: 14px;
    background: #d4af62;
    color: #080808;
    border: none;
    border-radius: 7px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

.signup-btn:hover {
    background: #f0cf82;
}

#message {
    text-align: center;
    margin-top: 18px;
    font-size: 14px;
    line-height: 1.5;
}

.login-link {
    text-align: center;
    margin-top: 22px;
    color: #aaa;
    font-size: 14px;
}

.login-link a {
    color: #d4af62;
    text-decoration: none;
    font-weight: bold;
}

.back-home {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #d4af62;
    text-decoration: none;
    font-size: 14px;
}

@media(max-width: 480px) {
    .signup-container {
        padding: 30px 22px;
    }
}
</style>
</head>

<body>

<div class="signup-container">

    <div class="logo">PB32 SHOES</div>
    <p class="subtitle">STEP INTO YOUR STYLE</p>

    <h2>Create Your Account</h2>

    <form id="signupForm">

        <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="name"
            placeholder="Enter your full name" required>
        </div>

        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email"
            placeholder="Enter your email" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password"
            placeholder="Create password (minimum 6 characters)"
            minlength="6" required>
        </div>

        <div class="input-group">
            <label>Confirm Password</label>
            <input type="password" id="confirmPassword"
            placeholder="Confirm your password" required>
        </div>

        <button type="submit" class="signup-btn" id="signupBtn">
            CREATE ACCOUNT
        </button>

        <p id="message"></p>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

    <a href="index.html" class="back-home">
        ← Back to Home
    </a>

</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    updateProfile
} from
"https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyA9LFfkR_flA6Y2W3oKEtJSSKytgqty1zQ",
    authDomain: "pb32-shoes.firebaseapp.com",
    projectId: "pb32-shoes",
    storageBucket: "pb32-shoes.firebasestorage.app",
    messagingSenderId: "535811826741",
    appId: "1:535811826741:web:71b0aff54f39350ce43d7c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const form = document.getElementById("signupForm");
const message = document.getElementById("message");
const button = document.getElementById("signupBtn");

form.addEventListener("submit", async function(e) {
    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword =
        document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
        message.style.color = "#ff7777";
        message.textContent = "Passwords do not match!";
        return;
    }

    if (password.length < 6) {
        message.style.color = "#ff7777";
        message.textContent = "Password must be at least 6 characters.";
        return;
    }

    button.disabled = true;
    button.textContent = "Creating Account...";
    message.textContent = "";

    try {
        const result = await createUserWithEmailAndPassword(
            auth, email, password
        );

        await updateProfile(result.user, {
            displayName: name
        });

        message.style.color = "#8ee6a1";
        message.textContent =
            "Account created successfully! You can now log in.";

        form.reset();

    } catch (error) {
        message.style.color = "#ff7777";

        if (error.code === "auth/email-already-in-use") {
            message.textContent = "This email is already registered.";
        } else if (error.code === "auth/invalid-email") {
            message.textContent = "Please enter a valid email address.";
        } else if (error.code === "auth/weak-password") {
            message.textContent = "Please choose a stronger password.";
        } else {
            message.textContent =
                "Signup failed. Please try again.";
        }

    } finally {
        button.disabled = false;
        button.textContent = "CREATE ACCOUNT";
    }
});
</script>

</body>
</html>
